[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["melt-ui"]

extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "I",
    "UP",
    "RUF100",
]

ignore = [
    "E501",
    "E731",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.pixi.workspace]
name = "melt-ui"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.dependencies]
python = "3.11.*"
nodejs = "*"
pip = "*"

[tool.pixi.pypi-dependencies]
ptmelt = { git = "https://github.com/NatLabRockies/pt-melt.git", rev = "390ddbe2613d50fe3c52b34bd6c8cd18716d67c8" }
numpy = "*"
pandas = "*"
scikit-learn = "*"
torch = "*"
matplotlib = "*"
fastapi = { version = "*", extras = ["standard"] }
pydantic = "*"
seaborn = "*"
openpyxl = "*"
safetensors = "*"
pillow = "*"
transformers = "*"

[tool.pixi.feature.dev.pypi-dependencies]
black = "==26.5.1"
pre-commit = "==4.6.2"
ruff = "==0.16.8"

[tool.pixi.tasks]
start = { cmd = "bash start.sh", cwd = "melt-ui" }

[tool.pixi.feature.dev.tasks]
lint = "ruff check ."
format-check = "black --check ."
compile = "python -m compileall -q melt-ui"
precommit = "pre-commit run --all-files"

[tool.pixi.environments]
dev = ["dev"]
