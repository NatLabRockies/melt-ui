name: melt-ui
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - nodejs
  - pip
  - pip:
    - git+https://github.com/NatLabRockies/pt-melt.git
    - numpy
    - pandas
    - scikit-learn
    - torch
    - matplotlib
    - fastapi[standard]
    - pydantic
    - seaborn
    - openpyxl
    - safetensors
    - pillow
    - transformers
    - supervision
